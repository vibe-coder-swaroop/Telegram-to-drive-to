name: B2 to Google Drive

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf << EOF
          [b2]
          type = b2
          account = ${{ secrets.B2_ACCOUNT_ID }}
          key = ${{ secrets.B2_APPLICATION_KEY }}

          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive.json
          EOF

          echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}' > /tmp/gdrive.json

      - name: Transfer
        run: |
          rclone copy b2:your-bucket gdrive:BackblazeBackup \
            --transfers 8 \
            --checkers 16 \
            --progress
